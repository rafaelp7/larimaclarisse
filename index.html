<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Lar Irmã Clarice</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Lar Irmã Clarice" class="logo">
    <h2>Lar Irmã Clarice</h2>
    <p class="subtitle">Acesso ao Sistema</p>

    <!-- Formulário de Acesso -->
    <div id="login-section">
      <input type="email" id="email" placeholder="E-mail" value="contato@larirmaclarice.com.br">

      <!-- Opção 1: Biometria / Reconhecimento Facial / Código do Aparelho -->
      <button id="btn-biometric" class="btn-primary">
        📲 Entrar com Biometria / Facial
      </button>

      <div class="divider">ou entre com senha / código</div>

      <!-- Opção 2: Usuário e Senha tradicional -->
      <input type="password" id="password" placeholder="Senha de acesso">
      <button id="btn-password" class="btn-secondary">Entrar com Senha</button>
    </div>

    <!-- Área Logada -->
    <div id="dashboard-section" style="display: none;">
      <h3>Painel Administrativo</h3>
      <p id="user-info"></p>
      
      <button id="btn-register-passkey" class="btn-secondary">
        ➕ Ativar Biometria neste Celular/PC
      </button>
      
      <button id="btn-logout" class="btn-danger">Sair</button>
    </div>

    <p id="status-msg" class="status"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
