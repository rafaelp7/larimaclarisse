<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lar Irmã Clarice - Acesso</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f7f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 36px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(27, 83, 85, 0.08);
      text-align: center;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container svg {
      width: 90px;
      height: 90px;
      fill: #43b3ae;
    }

    .title {
      color: #1a4b4f;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #43b3ae;
      font-size: 13px;
      letter-spacing: 0.3px;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #557071;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d2e4e4;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: #2c3e50;
      background: #fbfdfd;
    }

    .input-field:focus {
      border-color: #43b3ae;
      box-shadow: 0 0 0 3px rgba(67, 179, 174, 0.15);
      background: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-bio {
      background-color: #43b3ae;
      color: #ffffff;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    .btn-bio:hover {
      background-color: #389d99;
    }

    .btn-pass {
      background-color: #1a4b4f;
      color: #ffffff;
      margin-top: 10px;
    }

    .btn-pass:hover {
      background-color: #13393c;
    }

    .divider {
      position: relative;
      margin: 20px 0;
      text-align: center;
    }

    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e2ecec;
    }

    .divider span {
      position: relative;
      background: #ffffff;
      padding: 0 12px;
      font-size: 12px;
      color: #8da3a4;
      text-transform: uppercase;
      font-weight: 500;
    }

    .btn-secondary {
      background-color: #e9f5f5;
      color: #1a4b4f;
      margin-top: 10px;
    }

    .btn-danger {
      background-color: #feecec;
      color: #c0392b;
      margin-top: 12px;
    }

    .status-msg {
      margin-top: 18px;
      font-size: 13px;
      color: #e74c3c;
      min-height: 18px;
    }

    .status-msg.success {
      color: #27ae60;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo-container">
      <!-- Ícone estilizado do Lar Irmã Clarice -->
      <svg viewBox="0 0 100 100">
        <path d="M50 72 C35 60, 20 48, 20 33 C20 22, 28 15, 38 15 C44 15, 48 18, 50 21 C52 18, 56 15, 62 15 C72 15, 80 22, 80 33 C80 48, 65 60, 50 72 Z" fill="#e74c3c"/>
        <path d="M22 65 C22 50, 30 35, 40 25 C41 27, 40 31, 38 35 C32 45, 30 55, 34 68 Z" fill="#43b3ae"/>
        <path d="M78 65 C78 50, 70 35, 60 25 C59 27, 60 31, 62 35 C68 45, 70 55, 66 68 Z" fill="#43b3ae"/>
      </svg>
    </div>

    <h1 class="title">Lar Irmã Clarice</h1>
    <p class="subtitle">Casa de repouso para idosos</p>

    <!-- Formulário de Login -->
    <div id="login-section">
      <div class="input-group">
        <label for="email">E-mail de acesso</label>
        <input type="email" id="email" class="input-field" placeholder="exemplo@larirmaclarice.com.br" value="contato@larirmaclarice.com.br">
      </div>

      <button id="btn-biometric" class="btn btn-bio">
        <span>🔐</span> Entrar com Biometria / Facial
      </button>

      <div class="divider">
        <span>ou utilize a sua senha</span>
      </div>

      <div class="input-group">
        <label for="password">Senha ou PIN</label>
        <input type="password" id="password" class="input-field" placeholder="Digite a sua senha">
      </div>

      <button id="btn-password" class="btn btn-pass">
        Entrar com Senha
      </button>
    </div>

    <!-- Área Logada -->
    <div id="dashboard-section" style="display: none;">
      <h2 style="color: #1a4b4f; font-size: 18px; margin-bottom: 8px;">Acesso Confirmado</h2>
      <p id="user-info" style="font-size: 14px; color: #557071; margin-bottom: 20px;"></p>

      <button id="btn-register-passkey" class="btn btn-secondary">
        📲 Registar Biometria neste Aparelho
      </button>

      <button id="btn-logout" class="btn btn-danger">
        Terminar Sessão
      </button>
    </div>

    <p id="status-msg" class="status-msg"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://oqkbhaabtnpjmxsdewtc.supabase.co';
    const SUPABASE_KEY = 'SUA_CHAVE_ANON_AQUI'; // Insira a sua chave pública anónima do Supabase

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const statusMsg = document.getElementById('status-msg');
    const loginSection = document.getElementById('login-section');
    const dashSection = document.getElementById('dashboard-section');
    const userInfo = document.getElementById('user-info');

    function setStatus(msg, isSuccess = false) {
      statusMsg.innerText = msg;
      statusMsg.className = isSuccess ? 'status-msg success' : 'status-msg';
    }

    function showDashboard(email) {
      loginSection.style.display = 'none';
      dashSection.style.display = 'block';
      userInfo.innerText = `Conectado: ${email}`;
      setStatus('');
    }

    // 1. Entrar com E-mail e Senha
    document.getElementById('btn-password').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        setStatus('Preencha o e-mail e a senha.');
        return;
      }

      setStatus('A autenticar...');
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        setStatus('Erro no acesso: ' + error.message);
      } else {
        localStorage.setItem('user_email', email);
        showDashboard(email);
      }
    });

    // 2. Registar Biometria / Passkey
    document.getElementById('btn-register-passkey').addEventListener('click', async () => {
      const email = localStorage.getItem('user_email');
      if (!window.PublicKeyCredential) {
        setStatus('Biometria não suportada neste navegador.');
        return;
      }

      try {
        setStatus('Confirme com o seu dedo ou reconhecimento facial...');
        const challenge = window.crypto.getRandomValues(new Uint8Array(32));
        const userId = new Uint8Array(16);
        window.crypto.getRandomValues(userId);

        const credential = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: "Lar Irmã Clarice" },
            user: { id: userId, name: email, displayName: email },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000
          }
        });

        if (credential) {
          const credIdBase64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
          await sb.from('user_passkeys').insert([{ user_email: email, credential_id: credIdBase64 }]);
          localStorage.setItem(`passkey_${email}`, credIdBase64);
          setStatus('Biometria guardada com sucesso neste dispositivo!', true);
        }
      } catch (err) {
        setStatus('Falha ao registar biometria: ' + err.message);
      }
    });

    // 3. Entrar com Biometria
    document.getElementById('btn-biometric').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        setStatus('Introduza o seu e-mail acima primeiro.');
        return;
      }

      let credIdBase64 = localStorage.getItem(`passkey_${email}`);
      if (!credIdBase64) {
        const { data } = await sb.from('user_passkeys').select('credential_id').eq('user_email', email).limit(1);
        if (data && data.length > 0) credIdBase64 = data[0].credential_id;
      }

      if (!credIdBase64) {
        setStatus('Nenhuma biometria vinculada. Entre com a senha primeiro para ativar.');
        return;
      }

      try {
        setStatus('Aproxime o dedo ou aponte o rosto...');
        const challenge = window.crypto.getRandomValues(new Uint8Array(32));
        const credId = Uint8Array.from(atob(credIdBase64), c => c.charCodeAt(0));

        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{ id: credId, type: 'public-key' }],
            userVerification: 'required'
          }
        });

        if (assertion) {
          localStorage.setItem('user_email', email);
          showDashboard(email);
        }
      } catch (err) {
        setStatus('Autenticação biométrica cancelada.');
      }
    });

    // 4. Terminar Sessão
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await sb.auth.signOut();
      localStorage.removeItem('user_email');
      dashSection.style.display = 'none';
      loginSection.style.display = 'block';
      setStatus('');
    });
  </script>
</body>
</html>
